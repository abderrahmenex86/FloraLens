# Garden / houseplant species model (27 curated taxa, GBIF photos).
model_name: repvit_m1.dist_in1k
class_list: shared/classes/plants.yaml
data_manifest: data/processed/garden/manifest.jsonl
output_dir: ml/runs/garden_repvit_m1
input_size: 224
epochs: 20
batch_size: 128
lr_head: 0.001
lr_backbone: 0.0001
weight_decay: 0.05
label_smoothing: 0.1
drop_rate: 0.1
drop_path_rate: 0.05
class_balance: true
num_workers: 12
prefetch_factor: 4
channels_last: true
compile: false
seed: 42
amp: bf16
pretrained: true
