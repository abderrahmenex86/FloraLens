# FloraLens plant class list.
#
# This is a seed anchor list, not the final 600 classes. Class ids are stable:
# never renumber an existing id after a model has been trained on it.
#
# Build the full list by adding regional/houseplant classes from iNaturalist and
# filling with Pl@ntNet-300K species that have enough images. Keep genus-level
# labels for hybrid/cultivar groups such as Bougainvillea and Chrysanthemum.

version: "2026.11-anchor"
target: plants
