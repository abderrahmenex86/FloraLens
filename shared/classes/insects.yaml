# FloraLens garden-insect class list (seed).
#
# This is deliberately coarse: family/order level where species ID from a phone
# photo is not realistic. The model also gets a separate life-stage head
# (adult / nymph / larva / pupa / egg) and a role head/label
# (pest / beneficial / neutral / unknown).
#
# Non-commercial project: iNaturalist (including NC), IP102 (academic) and
# InsectSet459 are usable. Keep attribution.

