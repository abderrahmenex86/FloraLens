# FloraLens plant-health labels.
#
# This is not a taxonomy. Labels are host-conditioned: a citrus label is only
# offered when the plant ID is citrus. Abiotic classes are combined with the
# questionnaire/rule engine; they must never be presented as a standalone
# photo diagnosis.

version: "2026.11-anchor"
target: disease
classes:
  - class_id: 0
    scientific_name: Healthy
    common_name: Healthy
    rank: complex
    kind: healthy
    host: general
    symptoms: []

  # --- citrus ---------------------------------------------------------------
  - class_id: 1
    scientific_name: Citrus huanglongbing
    common_name: Citrus greening (HLB)
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [yellow_shoots, blotchy_mottle, lopsided_fruit, vein_yellowing]
    notes: "Quarantine disease; confirm with a local extension service."

  - class_id: 2
    scientific_name: Citrus canker
    common_name: Citrus canker
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [raised_lesions, yellow_halo, leaf_drop]
    notes: "Quarantine disease in many regions."

  - class_id: 3
    scientific_name: Citrus melanose
    common_name: Citrus melanose
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [small_brown_spots, sandpaper_texture, tear_stain]

  - class_id: 4
    scientific_name: Citrus scab
    common_name: Citrus scab
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [corky_scabs, distorted_leaves, warty_fruit]

  - class_id: 5
    scientific_name: Citrus sooty mold
    common_name: Sooty mold
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [black_coating, sticky_honeydew, ant_activity]
    notes: "A secondary symptom of scale/aphid/whitefly infestations."

  - class_id: 6
    scientific_name: Citrus tristeza virus
    common_name: Citrus tristeza
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [vein_clearing, stem_pitting, dieback]

  - class_id: 7
    scientific_name: Phytophthora root rot
    common_name: Citrus root rot
    rank: complex
    kind: biotic
    host: citrus
    symptoms: [root_rot, mushy_roots, canopy_thinning, dieback]
    notes: "Requires root/soil inspection; not diagnosable from a leaf photo."

  - class_id: 8
    scientific_name: Iron deficiency
    common_name: Iron chlorosis
    rank: complex
    kind: nutrient
    host: citrus
    symptoms: [interveinal_chlorosis, young_leaves, pale_new_growth]

  - class_id: 9
    scientific_name: Zinc deficiency
    common_name: Zinc deficiency
    rank: complex
    kind: nutrient
    host: citrus
    symptoms: [small_leaves, mottled_leaves, rosetting]

  - class_id: 10
    scientific_name: Magnesium deficiency
    common_name: Magnesium deficiency
    rank: complex
    kind: nutrient
    host: citrus
    symptoms: [interveinal_chlorosis, older_leaves, green_v_shape]

  # --- apple ----------------------------------------------------------------
  - class_id: 11
    scientific_name: Apple scab
    common_name: Apple scab
