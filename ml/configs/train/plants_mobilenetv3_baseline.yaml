# Baseline: the current FloraLens backbone. Use the same manifest, splits and
# augmentation as the challengers so the comparison is honest.
model_name: mobilenetv3_large_100.ra_in1k
class_list: shared/classes/plants.yaml
data_manifest: data/processed/plants/manifest.jsonl
output_dir: ml/runs/plants_mobilenetv3_baseline
input_size: 224
epochs: 30
batch_size: 128
lr_head: 0.001
lr_backbone: 0.0001
weight_decay: 0.05
label_smoothing: 0.1
drop_rate: 0.1
drop_path_rate: 0.05
class_balance: true
num_workers: 8
seed: 42
amp: bf16
pretrained: true
