[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floralens-ml"
version = "0.1.0"
description = "Dataset, training, evaluation and export pipeline for FloraLens"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "segmentation-models-pytorch>=0.4",
]
eval = [
    "scikit-learn>=1.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dedupe = [
    "imagehash>=4.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "types-tqdm>=4.66",
]

[project.scripts]
floralens = "floralens_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/floralens_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
